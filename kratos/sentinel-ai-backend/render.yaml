version: "3"

services:
  - type: web
    name: sentinel-backend
    env: python
    rootDir: kratos/sentinel-ai-backend
    buildCommand: "pip install uv && uv pip install --system -e ."
    startCommand: "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sentinel-db
          property: connectionString
      - key: FRONTEND_URL
        sync: false
      - key: API_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true

databases:
  - name: sentinel-db
    databaseName: sentinel
    user: sentinel_user
