name: Backend CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

jobs:
  backend:
    name: Python Backend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: sentinel-ai-backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"

      - name: Initialize Database
        run: |
          python scripts/setup_sqlite_dev.py
          python -m app.ingestion.run
          python scripts/seed_users.py

      - name: Run tests
        run: pytest