[project]
name = "sentinel-ai-backend"
version = "0.1.0"
description = "Sentinel AI — From Compliance Documents to Continuous Trust. Backend (Phase 1: foundation + real dataset integration)."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30",
    "pydantic[email]>=2.7,<3.0",
    "pydantic-settings>=2.3",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "psycopg[binary]>=3.1",
    "alembic>=1.13",
    "python-jose[cryptography]>=3.3",
    # bcrypt is used directly, not through passlib: passlib 1.7.4 is
    # unmaintained and its bcrypt backend breaks against bcrypt >= 4.1.
    "bcrypt>=4.1",
    "python-multipart>=0.0.9",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "aiosqlite>=0.20",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Integration smoke tests: they need Postgres up, migrations applied and
# `python -m app.ingestion.run` completed at least once.
addopts = "-q"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
